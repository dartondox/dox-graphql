name: dox_graphql_workspace
publish_to: 'none'

environment:
  sdk: ^3.13.0

# Dart pub workspace: one `dart pub get` at the root links all packages
# and writes one pubspec.lock. Each package has its own version and its
# own release tag (<package>-v<version>).
workspace:
  - packages/dox-graphql
  - packages/dox-graphql-builder
  - packages/dox-graphql-orm
  - packages/test-app

# The tests use SQLite only: skip the build of the native Postgres and
# MySQL drivers of dox_orm.
hooks:
  user_defines:
    dox_postgres_native:
      skip: true
    dox_mysql_native:
      skip: true
