name: dox_graphql
description: 'GraphQL for Dart and the Dox framework: schema, validation, execution, introspection, DataLoader and an HTTP endpoint with GraphiQL.'
version: 0.0.1
homepage: https://dartondox.dev
repository: https://github.com/dartondox/dox-graphql

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  dox_annotation: ^3.2.0
  dox_core: ^3.2.3
  gql: ^1.0.1
  meta: ^1.19.0
  source_span: ^1.10.2

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0

# The `dox` CLI finds the commands of this package here (`dox graphql:install`).
dox:
  commands: package:dox_graphql/commands.dart
